# Production deployment: manual, gated. Run from the Actions tab with
# "Run workflow"; the "production" environment approval applies when it is
# configured in repository settings. Publishes production image tags to
# GHCR after the full test suite passes.
name: Production deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm the production publish.'
        required: true
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Test suite gate
    uses: ./.github/workflows/tests.yml

  publish-backend:
    name: Publish backend image (production)
    runs-on: ubuntu-latest
    needs: tests
    environment: production
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecomind-backend:prod
            ghcr.io/${{ github.repository_owner }}/ecomind-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha

  publish-frontend:
    name: Publish frontend image (production)
    runs-on: ubuntu-latest
    needs: tests
    environment: production
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecomind-frontend:prod
            ghcr.io/${{ github.repository_owner }}/ecomind-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
