# Development deployment: publish container images to GHCR on every push
# to main, after the test suite passes. Pull the images with:
#   docker compose pull && docker compose up -d
name: Development deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Test suite gate
    uses: ./.github/workflows/tests.yml

  publish-backend:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecomind-backend:main
            ghcr.io/${{ github.repository_owner }}/ecomind-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha

  publish-frontend:
    name: Publish frontend image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecomind-frontend:main
            ghcr.io/${{ github.repository_owner }}/ecomind-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
