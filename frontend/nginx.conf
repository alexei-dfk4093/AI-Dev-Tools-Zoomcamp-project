# EcoMind production web server for the containerized frontend.
# The backend is reachable as "backend" on the compose network; this mirrors
# the Vite dev proxy, which forwards /api to the backend unchanged.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable and may be cached aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API traffic is passed through with the original path; backend routes
    # are registered under /api/v1.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Single-page app: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
